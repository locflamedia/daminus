# Harness stand-in for a distro's nginx.conf: example.* names only.
user www-data;
worker_processes auto;
# server { listen 9999; server_name commented.example.com; }
events { worker_connections 768; }
http {
	include /etc/nginx/mime.types;
	upstream shop_app { server 127.0.0.1:3000; server 127.0.0.1:3001 backup; }
	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
