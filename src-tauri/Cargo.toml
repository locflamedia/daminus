[package]
name = "daminus"
description = "Daminus desktop app (Tauri shell over daminus-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Binary name is what macOS shows in the Dock during `tauri dev` (unbundled).
[[bin]]
name = "Daminus"
path = "src/main.rs"

# The app logic is a library so tests can call commands as plain functions.
[lib]
name = "daminus_app"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
daminus-core = { path = "../crates/core" }
log = "0.4.34"
serde = "1.0.229"
serde_json = "1.0.151"
tauri = { version = "2.11", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-log = "2.9"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
tokio = { version = "1.53", features = ["rt", "sync", "macros", "time"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
time = { version = "0.3.47", features = ["local-offset", "formatting", "macros"] }
tracing = { version = "0.1.44", features = ["log"] }

[lints]
workspace = true

[dev-dependencies]
daminus-core = { path = "../crates/core", features = ["fake"] }
tempfile = "3.27.0"
# Mock runtime for driving the real IPC commands in tests (no webview).
tauri = { version = "2.11", features = ["test"] }
