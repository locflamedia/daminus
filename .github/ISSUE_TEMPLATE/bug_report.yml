name: 🐛 Bug report
description: Something doesn't work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Before you submit
      options:
        - label: I searched open and closed issues and this hasn't been reported.
          required: true
        - label: I'm using the latest release.
          required: true
        - label: I removed secrets, real hostnames, and IPs from everything below.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add project with ...
        2. Click Scan
        3. See error ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Daminus version
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Your OS
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: server-os
    attributes:
      label: Server OS (if the bug is about a check or scan)
      placeholder: Ubuntu 24.04

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
