name: Release

# A pushed `v*` tag builds both macOS DMGs and publishes a GitHub release.
# A manual run is a dry run: it builds and uploads workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: verify tag matches the workspace version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release/check-tag.sh "$TAG"

  build:
    name: build (${{ matrix.arch }})
    needs: verify-tag
    # verify-tag is skipped on manual runs; a failed check still blocks the build.
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.verify-tag.result) }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency caches here: release artifacts must not come from restored state.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Add the Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Read the workspace version
        id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p;}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "no workspace version found in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the app (ad-hoc signed through the Tauri config)
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm tauri build --bundles app --target "$TARGET"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          update-environment: true
      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/pip" install --require-hashes -r scripts/release/requirements.txt
          echo "$RUNNER_TEMP/release-venv/bin" >> "$GITHUB_PATH"
      - name: Package the DMG
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          ./scripts/release/package-dmg.sh \
            "target/$TARGET/release/bundle/macos/Daminus.app" \
            "out/Daminus_${VERSION}_${ARCH}.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-${{ matrix.arch }}
          path: out/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish the GitHub release
    needs: [verify-tag, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dmg-*
          path: release
          merge-multiple: true
      - name: Write and verify SHA256SUMS
        run: ./scripts/release/checksums.sh release
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.dmg
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in
            *-rc.*) flags="--prerelease" ;;
          esac
          # shellcheck disable=SC2086 # flags is empty or one fixed word
          gh release create "$TAG" release/*.dmg release/SHA256SUMS \
            --verify-tag --title "$TAG" --generate-notes $flags
